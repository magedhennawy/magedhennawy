name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit (optional)
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
   github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      # See action.yml for all options
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN }}
          plugin_achievements: no                # Disabled: plugin is chronically broken and renders a red "Unexpected error"
          plugin_isocalendar: yes                # 3D contribution calendar (reliable replacement for the achievements block)
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css                            # Don't let static-site markup skew the chart
          plugin_languages_details: percentage                           # Show percentage next to each language
          plugin_languages_threshold: 2%                                 # Hide languages under 2%
          plugin_languages_limit: 8                                      # Display up to 8 languages
#           plugin_languages_sections: most-used, recently-used           # Display most used and recently used languages stats
#           plugin_languages_indepth: no                                  # Get indepth stats (see documentation before enabling)
#           plugin_languages_recent_load: 500                             # Load up to 500 events to compute recently used stats
#           plugin_languages_recent_days: 7                               # Limit recently used stats to last week
#           commits_authoring: lowlighter@users.noreply.github.com        # Surnames or email addresses used to identify your commits
          
